name: zega_alert_mobile
description: ZEGA-ALERT citizen app - Crime Reporting, Missing Person Finder & Emergency Assistance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  socket_io_client: ^2.0.3
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  geolocator: ^11.0.0
  workmanager: ^0.10.10
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  share_plus: ^10.1.4
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_webrtc: ^0.12.1
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
